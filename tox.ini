[tox]
envlist = lint, py39, py310, py311, py312, py313, py314
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = run the test suite
deps =
    coverage
commands =
    coverage run -m unittest discover -s tests -t .
    coverage report

[testenv:lint]
description = lint and format check
skip_install = True
deps =
    ruff
commands =
    ruff check dotted_dict tests examples
    ruff format --check dotted_dict tests examples
