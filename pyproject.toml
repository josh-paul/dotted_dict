[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotted_dict"
version = "2.0.0"
description = "Dotted access over dicts, for objectifying JSON and YAML you do not own."
readme = "README.rst"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Josh Paul", email = "trevalen@me.com" }]
keywords = ["dict", "dotted", "attribute", "json", "yaml", "config"]
dependencies = []

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/josh-paul/dotted_dict"
Source = "https://github.com/josh-paul/dotted_dict"
Issues = "https://github.com/josh-paul/dotted_dict/issues"

[tool.hatch.build.targets.wheel]
packages = ["dotted_dict"]

[tool.hatch.build.targets.sdist]
include = ["dotted_dict", "tests", "examples", "README.rst", "LICENSE"]

# ---------------------------------------------------------------------------
# Ruff replaces flake8, isort and black. Line length matches the historical
# flake8 setting so the diff stays about the modernisation, not reformatting.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
[tool.ruff.lint.per-file-ignores]
# Tests reach into internals on purpose, and a bare `d.attr` inside
# assertRaises is how you test that attribute access raises -- not a useless
# expression.
"tests/*" = ["SIM117", "B018"]

[tool.coverage.run]
branch = true
source = ["dotted_dict"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
